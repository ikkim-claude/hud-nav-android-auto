name: Release APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir src && tar -xJf project.tar.xz -C src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: src
      - run: cp src/app/build/outputs/apk/debug/app-debug.apk hud-nav.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1 hud-nav.apk --title "HUD 내비 설치 파일" --notes "휴대폰에서 hud-nav.apk를 눌러 설치하세요" \
            || gh release upload v1 hud-nav.apk --clobber
