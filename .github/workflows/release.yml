name: Release APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir src && tar -xJf project.tar.xz -C src && cp -r patch/. src/
      - run: |
          sed -i 's/applicationId = "com.hudnav.tmap"/applicationId = "kr.hudnav.nav5"/; s/versionCode = 1/versionCode = 6/' src/app/build.gradle.kts
          sed -i '/wv.setBackgroundColor(Color.BLACK)/a\        wv.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false)' src/app/src/main/java/com/hudnav/tmap/NavBridge.kt
          grep -E "applicationId|versionCode" src/app/build.gradle.kts
          grep -n "RendererPriority" src/app/src/main/java/com/hudnav/tmap/NavBridge.kt
      # 서명 키를 빌드마다 같게 유지 (다음 업데이트부터 덮어 설치 가능)
      - uses: actions/cache@v4
        with:
          path: ~/hudkey
          key: hud-debug-keystore-v2
      - run: |
          mkdir -p ~/hudkey
          [ -f ~/hudkey/debug.keystore ] || keytool -genkeypair -keystore ~/hudkey/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
          echo "ANDROID_USER_HOME=$HOME/hudkey" >> $GITHUB_ENV
          keytool -list -keystore ~/hudkey/debug.keystore -storepass android | grep -i fingerprint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: src
      - run: cp src/app/build/outputs/apk/debug/app-debug.apk hud-nav6.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v6 hud-nav6.apk --title "HUD 내비 설치 파일 v6 (차 화면 지도)" --notes "휴대폰에서 hud-nav6.apk를 눌러 설치하세요." \
            || gh release upload v6 hud-nav6.apk --clobber
