name: Release APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir src && tar -xJf project.tar.xz -C src && cp -r patch/. src/
      # 최신 HUD 화면(HTML) 넣기 (원래 파일이 읽기 전용이라 지우고 새로 씀)
      - run: |
          rm -f src/app/src/main/assets/index.html
          xz -dc index.html.xz > src/app/src/main/assets/index.html
          grep -c "showAdvice" src/app/src/main/assets/index.html
      - run: |
          sed -i 's/applicationId = "com.hudnav.tmap"/applicationId = "kr.hudnav.nav5"/; s/versionCode = 1/versionCode = 9/' src/app/build.gradle.kts
          F=src/app/src/main/java/com/hudnav/tmap/NavBridge.kt
          grep -q RendererPriority $F || sed -i '/wv.setBackgroundColor(Color.BLACK)/a\        wv.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false)' $F
          sed -i 's/© OpenStreetMap © CARTO/© OpenStreetMap/' src/app/src/main/java/com/hudnav/tmap/car/MapRenderer.kt
          grep -E "applicationId|versionCode" src/app/build.gradle.kts
          grep -c "RendererPriority\|FETCH_GUARD" $F
          grep -c "timedOut" src/app/src/main/java/com/hudnav/tmap/car/RoutesScreen.kt
      # 서명 키를 빌드마다 같게 유지 (덮어 설치 가능)
      - uses: actions/cache@v4
        with:
          path: ~/hudkey
          key: hud-debug-keystore-v2
      - run: |
          mkdir -p ~/hudkey
          [ -f ~/hudkey/debug.keystore ] || keytool -genkeypair -keystore ~/hudkey/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
          echo "ANDROID_USER_HOME=$HOME/hudkey" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: src
      - run: cp src/app/build/outputs/apk/debug/app-debug.apk hud-nav9.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v9 hud-nav9.apk --title "HUD 내비 설치 파일 v9" --notes "휴대폰에서 hud-nav9.apk를 눌러 설치하세요. 기존 앱(v8) 위에 덮어 설치됩니다." \
            || gh release upload v9 hud-nav9.apk --clobber
